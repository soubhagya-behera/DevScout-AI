spring.application.name=devscout-ai

server.port=${PORT:8080}

devscout.cache.ttl.minutes=30
# Maximum number of cached reports (in-memory, ConcurrentHashMap + LRU).
# When capacity is reached, expired entries are removed first, then least-recently-used.
# 500 entries is conservative for small-to-medium deployment (~2-5 MB). No Redis needed.
devscout.cache.max-entries=500

gemini.api.key=${GEMINI_API_KEY}

gemini.model=gemini-2.5-flash

gemini.timeout.connect.ms=10000

gemini.timeout.read.ms=60000

gemini.retry.max-attempts=3

github.token=${GITHUB_TOKEN}